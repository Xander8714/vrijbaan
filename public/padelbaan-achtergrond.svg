<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!--
    Origineel, zelf getekend luchtfoto-schema van een padelbaan (20m x 10m,
    echte verhoudingen: net in het midden, servicelijnen op 3m van het net,
    middenlijn die elk servicevak in tweeën deelt). Bewust GEEN echte foto:
    een stockfoto zou een licentie/toestemming vergen (zie de regels rond
    bestanden downloaden) — dit is 100% eigen werk, dus geen enkel risico
    daarop, en het is als achtergrond herbruikbaar op elke schaal (SVG).
  -->
  <defs>
    <linearGradient id="veld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d8a80" />
      <stop offset="100%" stop-color="#0c6e67" />
    </linearGradient>
    <linearGradient id="wand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3cc2b3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3cc2b3" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Glazen wand rondom, met een lichte gloed -->
  <rect x="2" y="2" width="396" height="196" rx="6" fill="url(#wand)" stroke="#70dbcd" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Speelveld -->
  <rect x="14" y="14" width="372" height="172" fill="url(#veld)" />

  <!-- Buitenlijnen -->
  <rect x="14" y="14" width="372" height="172" fill="none" stroke="#eefcfa" stroke-width="2" stroke-opacity="0.9" />

  <!-- Servicelijnen (3m van het net) -->
  <line x1="140" y1="14" x2="140" y2="186" stroke="#eefcfa" stroke-width="1.6" stroke-opacity="0.85" />
  <line x1="260" y1="14" x2="260" y2="186" stroke="#eefcfa" stroke-width="1.6" stroke-opacity="0.85" />

  <!-- Middenlijn per servicevak (net tot servicelijn, aan weerszijden) -->
  <line x1="140" y1="100" x2="188" y2="100" stroke="#eefcfa" stroke-width="1.4" stroke-opacity="0.8" />
  <line x1="212" y1="100" x2="260" y2="100" stroke="#eefcfa" stroke-width="1.4" stroke-opacity="0.8" />

  <!-- Net: paal-paal met mesh-textuur -->
  <line x1="200" y1="10" x2="200" y2="190" stroke="#0b1412" stroke-width="3" stroke-opacity="0.55" />
  <g stroke="#eefcfa" stroke-width="0.6" stroke-opacity="0.5">
    <line x1="197" y1="16" x2="203" y2="22" /><line x1="197" y1="24" x2="203" y2="30" />
    <line x1="197" y1="32" x2="203" y2="38" /><line x1="197" y1="40" x2="203" y2="46" />
    <line x1="197" y1="48" x2="203" y2="54" /><line x1="197" y1="56" x2="203" y2="62" />
    <line x1="197" y1="64" x2="203" y2="70" /><line x1="197" y1="72" x2="203" y2="78" />
    <line x1="197" y1="80" x2="203" y2="86" /><line x1="197" y1="88" x2="203" y2="94" />
    <line x1="197" y1="96" x2="203" y2="102" /><line x1="197" y1="104" x2="203" y2="110" />
    <line x1="197" y1="112" x2="203" y2="118" /><line x1="197" y1="120" x2="203" y2="126" />
    <line x1="197" y1="128" x2="203" y2="134" /><line x1="197" y1="136" x2="203" y2="142" />
    <line x1="197" y1="144" x2="203" y2="150" /><line x1="197" y1="152" x2="203" y2="158" />
    <line x1="197" y1="160" x2="203" y2="166" /><line x1="197" y1="168" x2="203" y2="174" />
    <line x1="197" y1="176" x2="203" y2="182" />
  </g>

  <!-- Bal, losjes bij een hoek -->
  <circle cx="60" cy="45" r="7" fill="#cbec27" stroke="#0b1412" stroke-opacity="0.3" stroke-width="0.8" />
  <path d="M54 39c2.5 2 4 4.5 4 7.5M66 39c-2.5 2-4 4.5-4 7.5" fill="none" stroke="#333d08" stroke-opacity="0.6" stroke-width="0.7" />
</svg>
